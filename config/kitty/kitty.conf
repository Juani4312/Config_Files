font_family JetBrainsMono NF Bold
font_size 12.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.9
confirm_os_window_close 0

# Animated cursor
cursor_trail 1

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 50000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 4

include colors.conf

# Scrollbar vertical clickeable
scrollbar always
scrollbar_interactive yes
scrollbar_jump_on_click yes
scrollbar_width 0.8
scrollbar_hover_width 1.5
scrollbar_handle_opacity 0.7
scrollbar_track_opacity 0.1
scrollbar_track_hover_opacity 0.25
scrollbar_min_handle_height 2
