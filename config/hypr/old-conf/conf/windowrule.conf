# Ignore maximize requests from apps. You'll probably like this.
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# Fix some dragging issues with XWayland
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
    
}

# Disable blur for floating XWayland window
windowrule = no_blur on, match:class xwayland:1, match:float true

windowrule {
	name = pavucontrol-float
	match:class = ^(org.pulseaudio.pavucontrol)$
	match:title = ^(Volume Control)$
	float = true
	size = 1000 700
}

windowrule {
	name = pavucontrol-size-floating
	match:class = ^(org.pulseaudio.pavucontrol)$
	match:float = true
	size = 1000 700
}

windowrule {
	name = bitwarden-float
	match:class = ^(librewolf)$
	match:title = ^(Extension: \(Bitwarden Password Manager\) - Bitwarden — LibreWolf)$
	float = true
	size = 700 1000
}

windowrule {
	name = bitwarden-size-floating
	match:class = ^(librewolf)$
	match:title = ^(Extension: \(Bitwarden Password Manager\) - Bitwarden — LibreWolf)$
	match:float = true
	size = 700 1000
}


windowrule {
	name = steam-popups-float
	match:class = ^(steam)$
	match:title = negative:^(Steam)$
	float = on
	center = on
	size = 900 700
}

windowrule {
	name = steam-friends-narrow
	match:class = ^(steam)$
	match:title = ^(Friends List|Lista de amigos|Amigos|notificationtoasts_.*)$
	size = 400 700
}

windowrule {
	name = steam-transparency
	match:class = ^(steam)$
	opacity = 0.9 0.8
}

windowrule {
        name = librewolf-transparency
        match:class = ^(librewolf)$
        opacity = 0.95 0.85 1
}

windowrule {
        name = tidal-transparency
        match:class = ^(tidal-hifi)$
        opacity = 0.95 0.8
}

windowrule {
        name = whatsapp-transparency
        match:class = ^(com.rtosta.zapzap)$
        opacity = 0.95 0.8
}

windowrule {
        name = discord-transparency
        match:class = ^(vesktop)$
        opacity = 1 0.95 1
}

windowrule {
	name = kitty-transparency
	match:class = ^(kitty)$
	opacity = 0.90 0.80
}
